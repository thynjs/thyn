name: Test

on:
  push:
    branches:
      - main
    paths:
      - 'packages/core/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        working-directory: packages/core
        run: npm install

      - name: Run tests
        working-directory: packages/core
        run: npm test
