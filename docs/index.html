<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>thyn</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <style>
	html, body {
		height: 100%;
		text-align: center;
		position: relative;
		margin: 0;
		background: #333;
		color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
	}

	* {
		box-sizing: border-box;
		font-weight: 200;
	}

	div {
		position: absolute;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
	}

	h1 {
		font-size: 48px;
		letter-spacing: 2px;
	}

	pre {
		width: 100%;
		max-width: calc(100vw - 20px);
		font-size: 14px !important;
		margin: 0 !important;
		padding: 10px 20px !important;
		border-radius: 10px;
		margin-bottom: 20px !important;
	}

	a {
		color: #fff;
	}
  </style>
</head>
<body>
<div>
	<h1>thyn</h1>
	<pre><code class="language-html"></code></pre>
	<a href="https://github.com/thynjs/thyn">source</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script>
const code = document.querySelector("code");
code.textContent = `<script>
  const count = $signal(0);
<\/script>

<button :onclick="() => count(c => c + 1)">
  Count: {{ count() }}
</button>

<style>
  button {
    background: #333;
  }
</style>`;
</script>
</body>
</html>
