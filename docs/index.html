<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>thyn</title>
	<link rel="icon" type="image/svg" href="/thyn.svg">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
	<style>
		html,
		body {
			height: 100%;
			text-align: center;
			position: relative;
			margin: 0;
			background: #24272f;
			color: #fff;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", Arial, sans-serif;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
		}

		* {
			box-sizing: border-box;
			font-weight: 200;
		}

		.main {
			width: 100%;
			margin: auto;
			max-width: 1200px;
			padding-top: 5%;
		}

		h1 {
			font-size: 48px;
			letter-spacing: 2px;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 12px;
		}

		h1 img {
			width: 50px;
			position: relative;
			top: 2px;
		}

		h4 {
			margin: 0;
		}

		.compiled-wrapper {
			display: flex;
			gap: 20px;
			flex-direction: column;
		}

		@media (min-width:800px) {
			.compiled-wrapper {
				flex-direction: row;
			}
		}

		.compiled-wrapper>* {
			flex-grow: 1;
			flex-basis: 1px;
			display: flex;
			gap: 10px;
			flex-direction: column;
		}

		pre {
			flex-grow: 1;
			width: 100%;
			max-width: calc(100vw - 40px);
			font-size: 14px !important;
			margin: auto !important;
			padding: 10px 20px !important;
			border-radius: 10px;
			margin-bottom: 20px !important;
			background: rgba(0, 0, 0, 0.25) !important;
		}

		code {
			word-break: break-all !important;
			white-space: pre-wrap !important;
			line-height: 1.25 !important;
		}

		.code {
			font-size: 12px !important;
		}

		.compiled {
			font-size: 12px !important;
		}

		a {
			color: #fff;
			margin-top: 20px;
			display: inline-block;
		}
	</style>
</head>

<body>
	<div class="main">
		<h1>
			<img src="/thyn.svg" />
			thyn
		</h1>
		<p class="tagline"></p>
		<div class="compiled-wrapper">
			<div>
				<h4>source</h4>
				<pre><code class="code language-javascript"></code></pre>
			</div>
			<div>
				<h4>compiled</h4>
				<pre><code class="compiled language-javascript"></code></pre>
			</div>
		</div>
		<a href="https://github.com/thynjs/thyn">GitHub</a>
	</div>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
	<script>
		const code = document.querySelector(".code");
		code.textContent = `// App.thyn
<script>
  const count = $signal(0);
<\/script>

<button :onclick="() => count(c => c + 1)">
  Count: {{ count() }}
</button>

<style>
  button {
    background: #333;
  }
</style>

// main.js
import { mount } from '@thyn/core';
import App from './App.thyn';

mount(App, document.body);`;
		const compiled = document.querySelector(".compiled");
		const compiledCode = 'let u,s;const r=[];function l(t){r.push(t),s||(s=!0,queueMicrotask(()=>{for(const n of r)f(n);r.length=0,s=!1}))}function p(t){const n=new Set;return(...o)=>{if(!o.length)return u&&(n.add(u),u.deps.add(n)),t;const e=o[0],i=typeof e=="function"?e(t):e;if(i!==t){t=i;for(const d of n)l(d)}}}function f(t,n){n||a(t);const o=u;u=t;const e=t.run();e&&(t.td?t.td.push(e):t.td=[e]),u=o}function _(t){const n={run:t,deps:new Set,td:null};return f(n,!0),n}function a(t){const{deps:n,td:o}=t;if(n.size){for(const e of n)e.delete(t);n.clear()}if(o){for(const e of o)e();t.td=null}}function h(t,n){n.appendChild(t())}let c;function m(){if(!c){c=document.createElement("button"),c.className="thyn-0";const t=document.createTextNode("");return c.appendChild(t),c}return c.cloneNode(!0)}function N(t){const n=p(0),o=m();return o.onclick=()=>n(e=>e+1),_(()=>{o.firstChild.nodeValue=`Count: ${n()}`}),o}h(N,document.body);';
		compiled.textContent = compiledCode;
		const taglines = [
			"The healthy choice for your codebase.",
			"Thyn is in. Bloat is out.",
			"So thyn, it barely exists.",
		];
		const tagline = document.querySelector(".tagline");
		tagline.textContent = taglines[Math.floor(Math.random() * taglines.length)];
	</script>
</body>

</html>
